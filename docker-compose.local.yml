services:
  postgres:
    image: postgres:16-alpine
    container_name: copec-local-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestion_ecole
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans le fichier .env}
    volumes:
      - copec_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./scripts/sync-schema-addon.sql:/docker-entrypoint-initdb.d/03-sync.sql:ro
      - ./scripts/sync-local-init.sql:/docker-entrypoint-initdb.d/04-local-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestion_ecole"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: copec-local-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:?Définissez JWT_SECRET dans le fichier .env}
      BULLETIN_QR_SECRET: ${BULLETIN_QR_SECRET:?Définissez BULLETIN_QR_SECRET dans le fichier .env}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: gestion_ecole
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans le fichier .env}
      FRONTEND_URL: http://localhost
      SYNC_ENABLED: "true"
      SYNC_DEVICE_ID: LOCAL-SERVER
      SYNC_INTERVAL_MS: 15000
      # À renseigner avec la chaîne Neon centrale.
      CENTRAL_DATABASE_URL: ${CENTRAL_DATABASE_URL:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-Indian/Antananarivo}
      APP_LOCALE: ${APP_LOCALE:-fr-FR}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v23.0}
      COPEC_MODE: ${COPEC_MODE:-production}
      DEMO_EMAIL_DAILY_LIMIT: ${DEMO_EMAIL_DAILY_LIMIT:-20}
      DEMO_WHATSAPP_DAILY_LIMIT: ${DEMO_WHATSAPP_DAILY_LIMIT:-5}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost}
    ports:
      - "4000:4000"
    volumes:
      - copec_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
        VITE_PUBLIC_APP_URL: ${VITE_PUBLIC_APP_URL:-http://localhost}
    container_name: copec-local-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  copec_pgdata:
  copec_uploads:
